# Same stack, but pulls the image built by GitHub Actions instead of building on the
# host. Set IMAGE to your own GHCR path, e.g. ghcr.io/<github-user>/jsx-render:latest
services:
  jsx_server:
    image: ${IMAGE:?set IMAGE to ghcr.io/<owner>/jsx-render:latest}
    container_name: jsx_server
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PGHOST: ${PGHOST:-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-recomp}
      PGUSER: ${PGUSER:-belta1}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD}
    volumes:
      - ${PAGES_PATH:-/home/belta1/docker_compose/config/jsx_server}:/pages:ro
    networks:
      - pgnet

networks:
  pgnet:
    external: true
